; php.ini del laboratorio php2shell
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

; Condiciones del PoC: memory_limit por debajo de post_max_size
memory_limit = 16M
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; Sesiones reales
session.save_handler = files
session.save_path = "C:/Users/d34247034/Downloads/PHP2P4IM0NSHELL/lab/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 0
session.cookie_samesite = Lax

; Vector rfc1867
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = p4im0n_up_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 1
